[project]
name = "aihub-codelab-agent-team"
version = "0.1.0"
description = "AI Hub Codelab: Build, Break and Defend an AI Agent Team"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.13.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
